version: 2

project_name: openwaqueue

env:
  - GOOS=linux

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: openwaqueue
    main: .
    binary: openwaqueue
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X openwaqueue/internal/version.Version={{.Version}}

archives:
  - id: openwaqueue
    formats: [tar.gz]
    name_template: >-
      {{ "openwaqueue" }}_
      {{- tolower .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
