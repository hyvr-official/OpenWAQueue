{{define "navbar"}}
<nav class="navbar border-bottom">
    <div class="container gap-2 flex-wrap">
        <span class="navbar-brand mb-0 h1 col-auto col-sm" style="font-size: 17px;">OpenWAQueue <small class="text-secondary" style="font-size: 13px; font-weight: 700;">v{{.Version}}</small></span>
        <div class="btn-group btn-group-sm" role="group" aria-label="Navigation">
            <a href="/" class="btn btn-outline-secondary{{if eq .Active "queue"}} active{{end}}" title="Queue"><i class="ri-file-list-line"></i><span class="d-none d-sm-inline"> Queue</span></a>
            <a href="/settings" class="btn btn-outline-secondary{{if eq .Active "settings"}} active{{end}}" title="Settings"><i class="ri-settings-4-line"></i><span class="d-none d-sm-inline"> Settings</span></a>
        </div>
        <div class="d-flex gap-2 col justify-content-end">
            {{block "navactions" .}}{{end}}
            <form method="post" action="/logout" autocomplete="off" class="m-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm" title="Logout"><i class="ri-logout-box-r-line"></i><span class="d-none d-sm-inline"> Logout</span></button>
            </form>
        </div>
    </div>
</nav>
{{end}}
